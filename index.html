<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DoIt| To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="todo-card">
      <header class="app-header">
        <div>
          <p class="eyebrow">DAILY PLANNER</p>
          <h1>Do<span>It</span></h1>
          <p class="subtitle">Keep your day organized, one task at a time.</p>
        </div>
        <div class="task-summary">
          <strong id="taskCount">0</strong><span>tasks</span>
        </div>
      </header>

      <form id="todoForm" class="todo-form">
        <input id="taskInput" type="text" placeholder="What needs to be done?"
               autocomplete="off" aria-label="New task">
        <button type="submit">Add Task</button>
      </form>

      <ul id="taskList" class="task-list"></ul>

      <div id="emptyState" class="empty-state">
        <div class="empty-icon">✓</div>
        <h2>You're all caught up!</h2>
        <p>Add a task above to get started.</p>
      </div>

      <footer class="app-footer">
        <span id="completedCount">0 completed</span>
        <button id="clearCompleted" type="button">Clear completed</button>
      </footer>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
